name: Generate Role & Skills Card

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate_role_card.py"

permissions:
  contents: write

jobs:
  update-role-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Role Card
        run: |
          python scripts/generate_role_card.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/role-card.svg

          git diff --cached --quiet && exit 0

          git commit -m "🔄 Auto update role card"

          git push
