name: Generate Role & Skills Card

# This workflow only needs to run ONCE (or whenever you edit the roles/skills
# in scripts/generate_role_card.py). The role rotation itself happens live
# inside the generated SVG using built-in animation — no scheduled runs needed.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_role_card.py"

permissions:
  contents: write

jobs:
  update-role-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate role & skills card
        run: python scripts/generate_role_card.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/role-card.svg
          if git commit -m "🎯 Regenerated role card"; then
            git push
          fi
